<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Almanac | Verify Email</title>
    <link href="/static/css/global.css" rel="stylesheet">
    <link href="/static/css/register.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="wrapper">
        <div class="title-text">
            <div class="title">Verify Your Account</div>
        </div>
        <div class="form-container">
            <div class="form-inner">
                <form id="verify-form" class="login" style="margin-left: 0;">
                    <p>An OTP has been sent to your email. Please enter it below.</p>
                    <div class="field">
                        <input type="text" id="otp-input" placeholder="Enter OTP" required>
                    </div>
                    <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" value="Verify">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/js/verify-email.js"></script>
</body>

</html>
