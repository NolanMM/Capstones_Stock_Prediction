<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Almanac | Portfolio</title>
    <link href="static/css/global.css" rel="stylesheet">
    <link href="static/css/portfolio.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><img src="./static/images/logo.jpeg" alt="The Almanac Logo" width="30"
                    height="30"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="marketprediction.html">The Almanac Predictor</a>
                    <a class="nav-link active" aria-current="page" href="portfolio.html">Your Portfolio</a>
                </div>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="account.html">Account</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="page-header" data-aos="fade-up">
            <h1>Portfolio</h1>
            <p>View and track your portfolio</p>
        </section>

        <section class="portfolio-card" data-aos="fade-left">
            <h3 class="mb-4 text-center">Add a Stock</h3> <form id="stockForm" class="row g-3">
                <div class="col-md-6">
                    <input class="form-control" list="datalistOptions" id="name" placeholder="Type to search for stocks..." required>
                    <datalist id="datalistOptions"></datalist>
                </div>
                <div class="col-md-6">
                    <button type="submit" class="btn btn-primary-custom w-100">Add Stock</button>
                </div>
            </form>
        </section>

        <section class="portfolio-card" data-aos="fade-left">
            <h3 class="mb-4 text-center">Your Portfolio</h3> <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th class="text-center">Stock</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="portfolioTable">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <div id="chartContainer" class="container mt-4 d-none" data-aos="fade-left">
            <div class="row mt-3">
                <div class="col-md-12">
                    <div class="portfolio-card">
                        <div class="card-body">
                            <canvas id="chLine" height="100"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md-12">
                    <div class="portfolio-card">
                        <div class="card-body">
                            <canvas id="chLine2" height="100"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md-6 mb-4">
                    <div class="portfolio-card">
                        <div class="card-body">
                            <canvas id="chBar" height="200"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="portfolio-card">
                        <div class="card-body">
                            <canvas id="chScatter" height="200"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md-12">
                    <section class="portfolio-card">
                        <h3 class="text-center mb-4">Recent Related News</h3>
                        <div id="newsContent" class="text-start mt-3">
                            </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="./static/js/portfolio.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
