<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Almanac | Portfolio</title>
    <link href="static/css/global.css" rel="stylesheet">
    <link href="static/css/portfolio.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><img src="./static/images/logo.jpeg" alt="Bootstrap" width="30"
                    height="30"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="marketprediction.html">The Almanac Predictor</a>
                    <a class="nav-link  active" aria-current="page" href="portfolio.html">Your Portfolio</a>
                </div>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="account.html">Account</a>
                </div>
            </div>
        </div>
    </nav>
</head>

<body>
    <!-- This will be the first section -->
    <div class="container text-center" data-aos="fade-left">
        <div class="row mt-3"  margin-top: 100px>
            <h1>Portfolio</h1>
            <div class="col">
                <p class="fs-3">View and track you portfolio</p>
            </div>
        </div>
    </div>

    <!-- This will be the second section -->
    <div class="container mt-4" data-aos="fade-left">
        <h3>Add a Stock</h3>
        <form id="stockForm" class="row g-3">
            <div class="col-md-3">
                <input class="form-control" list="datalistOptions" id="name" placeholder="Type to search for stocks..." required>
                <datalist id="datalistOptions">
                    <!-- Stocks will be inserted here dynamically -->
                </datalist>
            </div>
            <div class="col-md-3">
                <input type="number" class="form-control" id="stockPrice" placeholder="Price Paid" required>
            </div>
            <div class="col-md-3">
                <input type="number" class="form-control" id="stockQuantity" placeholder="Quantity" required>
            </div>
            <div class="col-md-3">
                <input type="date" class="form-control" id="stockDate" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Add Stock</button>
            </div>
        </form>
    </div>
    <div class="container mt-5" data-aos="fade-left">
        <h3>Your Portfolio</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Stock</th>
                    <th>Price Paid</th>
                    <th>Quantity</th>
                    <th>Purchase Date</th>
                    <th>Return on Investment</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="portfolioTable">
            </tbody>
        </table>
        <button id="minimizeView" class="btn btn-secondary d-none" onclick="restoreTable()">Minimize View</button>
    </div>

    <!-- This will be the Third section -->
    <div id="chartContainer" class="container mt-4 d-none" data-aos="fade-left">
        <div class="row mt-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <canvas id="chLine" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-6">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <canvas id="chLine2" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-6">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <canvas id="chBar" height="200"></canvas>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <canvas id="chScatter" height="200"></canvas>
                    </div>
                </div>
            </div>

            <div class="row mt-6">
                <div class="div text-center">
                    <h3>Recent Related News</h3>
                </div>
                <div class="col">
                    <div id="newsContent" class="text-left">
                        <!-- Recent News articles will be inserted here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./static/js/portfolio.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
    </body>
    
    </html>
