<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Almanac | Account</title>
    <link href="static/css/global.css" rel="stylesheet">
    <link href="static/css/account.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><img src="./static/images/logo.jpeg" alt="The Almanac Logo" width="30"
                    height="30"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="marketprediction.html">The Almanac Predictor</a>
                    <a class="nav-link" href="portfolio.html">Your Portfolio</a>
                </div>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link active" aria-current="page" href="account.html">Account</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="account-header" data-aos="fade-up">
            <h1>Account</h1>
            <p>View and update your information</p>
        </section>

        <section class="account-card" data-aos="fade-left">
            <div class="row justify-content-center align-items-center">
                <div class="col-lg-5 col-md-6 profile-image-section">
                    <div class="profile-image-wrapper">
                        <img id="profile-image" src="./static/images/profile-picture-placeholder.jpg" alt="Account Image">
                    </div>
                    <button class="btn btn-outline-secondary-custom" type="button" id="button-change-profile-picture"
                        onclick="changeProfilePicture()">Change Profile Picture</button>
                    <div id="url-input-container" class="mt-3 d-none w-100">
                        <input type="text" id="image-url-input" class="form-control mb-2" placeholder="Enter new image URL">
                        <div class="d-flex justify-content-center gap-2">
                            <button class="btn btn-primary-custom" id="button-confirm-url"
                                onclick="changeImageUrl()">Confirm</button>
                            <button class="btn btn-danger-custom" id="button-cancel-url"
                                onclick="cancelChange()">Cancel</button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7 col-md-6 d-flex flex-column">
                    <div class="info-group">
                        <label for="full-name-display" class="info-label">Full Name:</label>
                        <div id="full-name-display" class="info-display">Loading...</div>
                        <div id="name-input-container" class="mt-2 d-none">
                            <div class="row g-2 mb-2">
                                <div class="col">
                                    <label for="first-name-input" class="form-label visually-hidden">First Name</label>
                                    <input type="text" id="first-name-input" class="form-control" placeholder="First Name">
                                </div>
                                <div class="col">
                                    <label for="last-name-input" class="form-label visually-hidden">Last Name</label>
                                    <input type="text" id="last-name-input" class="form-control" placeholder="Last Name">
                                </div>
                            </div>
                            <div class="d-flex gap-2" >
                                <button class="btn btn-primary-custom" onclick="confirmName()">Confirm</button>
                                <button class="btn btn-danger-custom" onclick="cancelName()">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <div class="info-group">
                        <label for="email-display" class="info-label">Email:</label>
                        <div id="email-display" class="info-display">user@example.com</div>
                        <div id="email-input-container" class="mt-2 d-none">
                            <input type="email" id="email-input" class="form-control mb-2" placeholder="Enter new email">
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary-custom" id="button-confirm-email" onclick="confirmEmail()">Confirm</button>
                                <button class="btn btn-danger-custom" id="button-cancel-email" onclick="cancelEmail()">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <div class="info-group">
                        <label for="password-display" class="info-label">Password:</label>
                        <div id="password-display" class="info-display">********</div>
                        <div id="password-input-container" class="mt-2 d-none">
                            <input type="password" id="password-input" class="form-control mb-2" placeholder="Enter new password">
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary-custom" id="button-confirm-password"
                                    onclick="confirmPassword()">Confirm</button>
                                <button class="btn btn-danger-custom" id="button-cancel-password"
                                    onclick="cancelPassword()">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <div class="button-group-actions">
                        <button class="btn btn-primary-custom" type="button" id="button-edit-name"
                            onclick="editName()">Modify Name</button>
                        <button class="btn btn-primary-custom" type="button" id="button-edit-email"
                            onclick="editEmail()">Change Email</button>
                        <button class="btn btn-primary-custom" type="button" id="button-edit-password"
                            onclick="editPassword()">Change Password</button>
                        <button class="btn btn-danger-custom" type="button" id="button-log-out">Log Out</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="./static/js/auth-manager.js"></script>
    <script src="./static/js/account.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
