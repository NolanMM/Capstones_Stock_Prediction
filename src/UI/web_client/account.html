    <!-- Account Section -->
    <div class="container text-center mt-5" data-aos="fade-left">
        <div class="row">
            <h1>Account</h1>
            <div class="col">
                <h2>View and update your information </h2>
            </div>
        </div>
    </div>

<!-- Image and form layout -->
<div class="container" data-aos="fade-left">
    <div class="row mt-3">
        <div class="col-md-6 d-flex justify-content-center">
            <!-- Left side profile image container -->
            <div class="profile-image-container" id="profile-image-container">
                <img id="profile-image" src="./static/images/profile-picture-placeholder.jpg" alt="Account Image">
                <div class="profile-info" id="change-profile-container">
                    <button class="btn btn-outline-secondary" type="button" id="button-change-email"
                        onclick="changeProfilePicture()">Change Profile Picture</button>
                </div>
                <!-- Input for new profile picture URL (hidden by default) -->
                <div id="url-input-container" class="d-none">
                    <input type="text" id="image-url-input" class="form-control" placeholder="Enter new image URL">
                    <button class="btn btn-outline-secondary mt-2" id="button-confirm-url"
                        onclick="changeImageUrl()">Confirm</button>
                    <button class="btn btn-outline-secondary mt-2" id="button-cancel"
                        onclick="cancelChange()">Cancel</button>
                </div>
            </div>
        </div>
        <div class="col-md-6 d-flex flex-column justify-content-center">
            <!-- Right side email and password -->
            <!-- Email Section -->
            <p class="fs-3">Email: <span id="email-display">user@example.com</span></p>
            <div id="email-input-container" class="d-none">
                <input type="email" id="email-input" class="form-control" placeholder="Enter new email">
                <button class="btn btn-outline-secondary mt-2" id="button-confirm-email" onclick="confirmEmail()">Confirm</button>
                <button class="btn btn-outline-secondary mt-2" id="button-cancel-email" onclick="cancelEmail()">Cancel</button>
            </div>
            
            <!-- Password Section -->
            <p class="fs-3">Password: <span id="password-display">********</span></p>
            <div id="password-input-container" class="d-none">
                <input type="password" id="password-input" class="form-control" placeholder="Enter new password">
                <button class="btn btn-outline-secondary mt-2" id="button-confirm-password"
                    onclick="confirmPassword()">Confirm</button>
                <button class="btn btn-outline-secondary mt-2" id="button-cancel-password"
                    onclick="cancelPassword()">Cancel</button>
            </div>
            <div class="row mt-3">
                <div class="col">
                    <button class="btn btn-outline-secondary" type="button" id="button-change-email"
                        onclick="editEmail()">Change Email</button>
                    <button class="btn btn-outline-secondary" type="button" id="button-change-password"
                        onclick="editPassword()">Change Password</button>
                    <button class="btn btn-outline-secondary" type="button" id="button-log-out">Log Out</button>
                    <button class="btn btn-outline-secondary" type="button" id="button-delete-account">Delete
                        Account</button>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="./static/js/account.js"></script>

    </script>
