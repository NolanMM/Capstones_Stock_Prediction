<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: auto; padding: 20px; }
        .header { font-size: 24px; color: #333; }
        .otp { font-size: 28px; font-weight: bold; color: #CC0000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Almanac Account Verification</div>
        <p>Hello {{ username }},</p>
        <p>Thank you for registering. Please use the following One-Time Password (OTP) to verify your account:</p>
        <p class="otp">{{ otp_code }}</p>
        <p>If you did not request this, please ignore this email.</p>
        <p>Regards,<br>The Almanac Team</p>
    </div>
</body>
</html>
